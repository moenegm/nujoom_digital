    hero:
      eyebrow: "نجوم ديجيتال · مسقط، عُمان"
      title_html: "كن حاضرًا على الإنترنت، سهل الإيجاد، وملحوظًا — كل ذلك من مكان واحد."
      lead: "نبني لك الموقع الإلكتروني ونظام الحجز، وننشئ صفحتك على خرائط جوجل وحساباتك على مواقع التواصل الاجتماعي، ونصوّر الصور والفيديوهات التي تعكس مستواك، ونقدّم دروسًا خصوصية مبنية على خبرة تعليمية حقيقية."
      cta_primary: "احجز مكالمة مجانية"
      cta_secondary: "تعرّف على خدماتنا"
    services:
      eyebrow: "خدماتنا"
      title: "ثلاث طرق نساعدك بها على تنمية عملك."
      lead: "سواء كنت بحاجة إلى موقع إلكتروني فعّال، أو حضور أقوى على الإنترنت، أو دعم تعليمي إضافي لأطفالك، نحن نبنيه وندير تشغيله ونستمر في دعمه."
      dev_title: "تطوير البرمجيات"
      dev_body: "مواقع إلكترونية مخصصة، أنظمة حجز وجدولة، بوابات للعملاء، وأدوات لإدارة الأعمال — مبنية بلغة Ruby on Rails ومصممة لتناسب طريقة عملك تمامًا، لا أن تُحشر في قالب جاهز."
      photo_title: "التصوير والإنتاج"
      photo_body: "الظهور بالشكل الصحيح يبدأ من هنا: ملف تجاري وصفحة على خرائط جوجل، حضور على إنستغرام، صور وفيديوهات تعكس مستواك، وإعلانات تصل بها إلى الجمهور المناسب."
      tutor_title: "الدروس الخصوصية"
      tutor_body: "دروس خصوصية فردية وجماعية صغيرة مبنية على خلفية تعليمية قوية — للطلاب الذين يحتاجون شرحًا حقيقيًا، لا مجرد إجابات."
      proof: "تقويم الحجز أدناه ليس قالبًا جاهزًا ولا خدمة Calendly — بنيناه من الصفر لهذا الموقع: توفر حقيقي، بدون حجز مزدوج، وبدون رسوم اشتراك. إنه مثال عملي على ما يمكننا بناءه لعملك أنت."
    booking:
      eyebrow: "احجز مكالمة"
      title: "اختر يومًا ووقتًا."
      note: "مكالمة تعريفية مدتها 30 دقيقة — مجانية وبدون أي التزام. الأوقات المعروضة بتوقيت مسقط (GST). الأوقات المشطوبة محجوزة بالفعل."
      open_count:
        one: "موعد واحد متاح"
        other: "%{count} مواعيد متاحة"
      full: "محجوز بالكامل"
      no_slots: "لا توجد أوقات متبقية لهذا اليوم — جرّب يومًا آخر أعلاه."
      form_title: "أكّد مكالمتك"
      name_label: "الاسم"
      email_label: "البريد الإلكتروني"
      note_label: "ما الذي ترغب ببنائه؟ (اختياري)"
      submit: "تأكيد الحجز"
      error_generic: "يرجى إدخال اسمك وبريد إلكتروني صحيح."
      error_failed: "حدث خطأ ما — يرجى المحاولة مرة أخرى."
      error_taken: "عذرًا — تم حجز هذا الوقت للتو. يرجى اختيار وقت آخر."
      confirm_html: "تم حجز موعدك في %{slot}. سنتواصل معك للتأكيد — يمكنك التواصل في أي وقت على %{email} إذا احتجت لتغيير الموعد."
    contact:
      eyebrow: "تواصل معنا"
      title: "لديك مشروع في ذهنك؟"
      lead: "أخبرنا بما ترغب في بنائه وسنتواصل معك خلال يوم أو يومين."
      find_us: "اعثر علينا على جوجل ←"
      instagram: "تابعنا على إنستغرام"
      name_label: "الاسم"
      email_label: "البريد الإلكتروني"
      message_label: "الرسالة"
      submit: "إرسال الرسالة"
      error_generic: "يرجى تعبئة جميع الحقول ببريد إلكتروني صحيح."
      error_failed: "حدث خطأ ما — يرجى المحاولة مرة أخرى."
      confirm_html: "شكرًا لك يا %{name} — رسالتك في طريقها إلينا. سنتواصل معك خلال يوم أو يومين."
    footer:
      text_html: "© %{year} نجوم ديجيتال — مواقع إلكترونية، وسائل تواصل اجتماعي، ودروس خصوصية، ومقرنا في مسقط."
